services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
    env_file:
      - env/app.env
      - env/minio.env
    ports:
      - "8080:8080"
    networks:
      - shared
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy 

  postgres:
    container_name: postgres-sport
    image: postgres:17.5-alpine
    hostname: postgres
    env_file:
      - "./env/postgres.env"
    volumes:
      - pg_data:/data/postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - shared
  
  minio:
    container_name: minio-sport
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    env_file:
      - "./env/minio.env"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - shared
    

volumes:
  pg_data:
  minio_data:

networks:
  shared:
    driver: bridge